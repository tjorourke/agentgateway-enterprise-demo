[project]
name = "summarizer"
version = "0.1"
description = "summarizer agent"
readme = "README.md"
dependencies = [
  # google-adk 1.25.1 bundles LiteLLM directly for the kagent-adk base image.
  # AgentCore builds the agent from source in its own environment, where ADK
  # splits LiteLLM into the [extensions] extra — so declare `litellm` directly
  # too, or the AgentCore runtime fails to import the Anthropic model with
  # "LiteLLM support requires: pip install google-adk[extensions]".
  "google-adk==1.25.1",
  "litellm",
]
requires-python = ">=3.13"
