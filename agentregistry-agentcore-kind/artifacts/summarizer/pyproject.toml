[project]
name = "summarizer"
version = "0.1"
description = "summarizer agent"
readme = "README.md"
dependencies = [
  # google-adk 1.25.1 bundles LiteLLM directly, which the kagent path uses for
  # the anthropic model. The AgentCore path uses a custom BedrockClaude adapter
  # (summarizer/bedrock_model.py) over anthropic.AnthropicBedrock instead of
  # LiteLLM — AgentCore's source build splits LiteLLM into the [extensions]
  # extra it doesn't install, and LiteLLM's bedrock path also drops tool
  # descriptions. agent.py picks the model from MODEL_PROVIDER.
  "google-adk==1.25.1",
  "anthropic[bedrock]>=0.40",
]
requires-python = ">=3.13"
